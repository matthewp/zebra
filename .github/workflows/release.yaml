name: Release

# Publishes a package to npm when its tag is pushed:
#   v*               -> @matthewp/zebra        (packages/zebra)
#   zebra-astro-v*   -> @matthewp/zebra-astro  (packages/zebra-astro)
# Release flow: bump the package's package.json, commit
# "Release <name> vX.Y.Z", tag it, then push the tag.

on:
  push:
    tags:
      - 'v*'
      - 'zebra-astro-v*'

# Minimal default token permissions. Jobs opt in to writes explicitly.
permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true

  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing to npm (+ provenance)
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine package from tag
        id: pkg
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == zebra-astro-v* ]]; then
            echo "name=@matthewp/zebra-astro" >> "$GITHUB_OUTPUT"
            echo "dir=packages/zebra-astro" >> "$GITHUB_OUTPUT"
            echo "version=${REF#zebra-astro-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == v* ]]; then
            echo "name=@matthewp/zebra" >> "$GITHUB_OUTPUT"
            echo "dir=packages/zebra" >> "$GITHUB_OUTPUT"
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $REF does not match a known package prefix" >&2
            exit 1
          fi

      - name: Verify tag matches package version
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          TAG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./$DIR/package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match $DIR/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Ships dist/ produced from src/ via tsc; this also catches type errors.
        # zebra-astro consumes @matthewp/zebra's dist, so build zebra first.
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          npm run build --workspace @matthewp/zebra
          if [ "$NAME" = "@matthewp/zebra-astro" ]; then
            npm run build --workspace @matthewp/zebra-astro
          fi

      - name: Publish to npm
        run: npm publish --workspace ${{ steps.pkg.outputs.name }} --access public
